<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposal 1 - Garden and Grade Passport</title>
  <desc id="desc">A unified garden for the child with a separate grade passport panel for parent-facing coverage tracking.</desc>
  <rect width="1400" height="900" fill="#f7f5ea"/>
  <rect x="40" y="40" width="1320" height="820" rx="28" fill="#fffdf7" stroke="#d8d1bc" stroke-width="3"/>
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3b4a2f">Proposal 1: Unified Garden + Grade Passport</text>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="18" fill="#6e6a59">Child-facing motivation stays in one living garden. Grade completeness lives in a separate reassurance view.</text>

