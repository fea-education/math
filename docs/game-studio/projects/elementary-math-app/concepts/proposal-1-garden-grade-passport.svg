  <text x="1015" y="656" font-family="Arial, sans-serif" font-size="17" fill="#5a4e31">Stretch topics: optional</text>

  <text x="80" y="840" font-family="Arial, sans-serif" font-size="18" fill="#6e6a59">Strength: clean split between motivation and curriculum reassurance. Risk: two related systems to explain.</text>
